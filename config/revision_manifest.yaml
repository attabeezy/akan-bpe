limitations:
  - Exact Kaggle package versions were not retained.
  - Historical model revisions were not pinned to Hugging Face commit SHAs.
  - Historical result payloads omitted the training seed.
  - Optimizer, scheduler, warmup, weight decay, and clipping defaults were not fully exported.
  - Dataset and model licenses require final manuscript verification.
  - The audit manifest validates evidence; the separately hash-pinned revision GPU matrix drives
    new model experiment execution.
  - One normalized ASR sentence overlapped the historical v1 training and test splits; the
    active revision-v2 test set removes it and has no leakage exceptions.
  - The historical router classifier was serialized with scikit-learn 1.8.0 and evaluated
    under 1.9.0 with an InconsistentVersionWarning; routing is a secondary analysis.
