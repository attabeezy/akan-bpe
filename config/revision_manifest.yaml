      tokenizers: 0.22.2
      scikit-learn: 1.9.0
      numpy: 2.5.0
      PyYAML: 6.0.3
      protobuf: 7.35.1
  executed_gpu_runs:
    status: partially_recorded
    hardware: NVIDIA Tesla T4
    execution_surface: Kaggle split notebooks
    package_versions:
      status: not_recorded
      note: Exact package versions were not retained in the executed result payloads.

