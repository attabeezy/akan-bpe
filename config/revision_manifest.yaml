protocols:
  dataset_split:
    algorithm: deterministic local 80/10/10 split
    seed: 42
    row_schema:
      id: non-empty string
      text: non-empty string
      source: corpus identifier
    leakage_rule: >-
      New frozen splits must have no duplicate IDs and no NFC, whitespace-collapsed,
      case-folded text overlap between any training split and validation/test split.
      Historical exceptions must be identified by normalized-text SHA-256 below.
  tokenizer_training:
    implementation: Hugging Face tokenizers
    algorithm: BPE
    normalization: none
    pre_tokenizer: Whitespace
    unknown_token: "[UNK]"
    minimum_frequency: 0
    special_tokens:
      - "[PAD]"
      - "[UNK]"
      - "[CLS]"
      - "[SEP]"
      - "[MASK]"
      - "<s>"
      - "</s>"
      - "<pad>"
    primary_vocab_size: 8000
    mixed_corpus_balance: Upsample each input corpus to 45000 rows, then concatenate.
    random_seed:
      status: not_recorded
      note: The tokenizers BPE trainer invocation did not expose or record a seed.
  tokenizer_evaluation:
    regimes:
      asr: aka_asr_test_revision_v2
      formal: pristine_twi_test
    fertility_formula: total_tokens / total_whitespace_words
    baselines:
      - xlm-roberta-base
      - bert-base-multilingual-cased
      - google/mt5-base
  model_training:
    strategy: full vocabulary replacement
    tokenizer: mixed_tokenizer
    train_dataset: pristine_twi_train
    evaluation_dataset: pristine_twi_test
    max_train_samples: 4096
    max_eval_samples: 512
    max_length: 256
    per_device_batch_size: 1
    gradient_accumulation_steps: 16
    epochs: 1.0
    learning_rate: 0.0002
    quantization:
      bits: 4
      type: nf4
      double_quantization: true
      compute_dtype: float16
    qlora:
      rank: 16
      alpha: 32
      dropout: 0.05
      bias: none
      task_type: CAUSAL_LM
      target_modules:
        - q_proj
        - k_proj
        - v_proj
        - o_proj
        - gate_proj
        - up_proj
        - down_proj
      modules_to_save:
        - embed_tokens
        - lm_head
    optimizer_and_scheduler:
      status: not_recorded
      note: Historical artifacts did not export all Transformers TrainingArguments defaults.
    model_revision:
      status: not_recorded
      note: Hugging Face commit revisions were not pinned in historical runs.
  bpb_evaluation:
    name: corrected full-coverage bits per UTF-8 byte
    formula: total token negative log-likelihood in nats / ln(2) / evaluated UTF-8 bytes
    coverage: 100 percent of the same evaluation text for both tokenizers
    chunking: non-overlapping token chunks with one-token context handling
    max_length: 256
  generation_evaluation:
    metrics:
      chrf: sacrebleu.CHRF with word_order 0
      chrfpp: sacrebleu.CHRF with word_order 2
    examples: 512
    prompt_words: 48
    reference_words: 64
    max_new_tokens: 64
    batch_size: 4
    decoding:
      do_sample: false
      num_beams: 1
      temperature: not_applicable
      top_p: not_applicable
      top_k: not_applicable
      repetition_penalty: transformers_default
      stop_tokens: tokenizer_eos_and_pad_defaults

active_protocol:
  version: revision_v2
  zero_active_leakage_exceptions: true
  asr_test_dataset: aka_asr_test_revision_v2
  formal_test_dataset: pristine_twi_test
  locked_vocab_size_for_new_experiments: 32000
  vocabulary_lock_basis: vocab_ablation_results

