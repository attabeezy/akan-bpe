schema_version: 1

project:
  name: akan-bpe
  language: Akan (Twi)
  venue: IEEE Ghana ICAST 2026
  purpose: Reproducibility record for the July 2026 reviewer revision
  manifest_role: audit_only
  frozen_on: 2026-07-30
  timezone: Atlantic/Reykjavik

repository:
  baseline_commit: cf78efb3607ebcd3e712a45d9b58537d28bf3e65
  working_tree_at_freeze: modified
  note: >-
    The baseline commit identifies the checked-in code lineage. Frozen datasets and
    research artifacts are identified independently by their SHA-256 digests below.

naming:
  new_run_id_template: "{model}__{strategy}__v{vocab_size}__{init}__e{epochs}__s{seed}"
  new_run_id_pattern: "^[a-z0-9.-]+__(original|replacement|extension)__v[0-9]+__(random|mean_subword|preserved)__e[0-9]+(?:\\.[0-9]+)?__s[0-9]+$"
  historical_policy: Existing run IDs and filenames remain unchanged.

environments:
  local_validation:
    status: recorded
    operating_system: Windows
    python: 3.13.5
    packages:
      datasets: 5.0.0
